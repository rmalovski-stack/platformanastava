            flex-direction: column;

        function getSchoolYear() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth(); // 0 = јануари, 11 = декември
            // ако сме од септември (8) до декември (11) -> year/(year+1)
            if (month >= 8) {
                return year + '/' + (year + 1);
            } else {
                return (year - 1) + '/' + year;
            }
        }
        document.getElementById('schoolYearDisplay').textContent = getSchoolYear();

            programData.forEach((item, index) => {
                const num = index + 1;
                options += `<option value="${index}">Час ${num}: ${item.title}</option>`;
            });
            hourSelect.innerHTML = options;
        }
        populateSelect();

        totalSpan.textContent = programData.length;

        let selectedHourIndex = null; // null = сите

        function render() {
            const selectValue = hourSelect.value;
            // ако е избрана опција од select (вредност != ""), користи го тој индекс
            if (selectValue !== '') {
                selectedHourIndex = parseInt(selectValue, 10);
            } else {
                selectedHourIndex = null;
            }

            let visible = 0;
            let html = '';

            programData.forEach((item, index) => {
                const hourNum = index + 1;
                // Дали треба да се прикаже?
                let show = true;
                if (selectedHourIndex !== null && selectedHourIndex !== index) {
                    show = false;
                }

                if (!show) return;

                visible++;
                const selectedClass = (selectedHourIndex === index) ? ' selected' : '';
                html += `
                    <div class="card${selectedClass}" data-index="${index}">
                        <div class="card-header">
                            <span class="hour-badge">Час ${hourNum}</span>
                            <span class="month-tag">${item.month}</span>
                        </div>
                        <div class="card-title">${item.title}</div>
                        <div class="card-activities"><strong>Активности:</strong> ${item.activities}</div>
                        <div class="card-desc">${item.description}</div>
                    </div>
                `;
            });

            if (visible === 0) {
                html = `<div class="no-results">🔍 Нема пронајдено часови</div>`;
            }

            grid.innerHTML = html;
            visibleSpan.textContent = visible;

            // Додај клик на картичките за брз избор
            document.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx)) {
                        // Постави го select на тој час
                        hourSelect.value = idx;
                        // Изврши рендерирање
                        render();
                    }
                });
            });
        }

        // иницијално прикажи
        render();

        // настан
        hourSelect.addEventListener('change', function() {
            render();
        });

    })();
</script>

</body>
</html>
