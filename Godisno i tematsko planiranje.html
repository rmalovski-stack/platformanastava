                    content: generateGlobalPlan("1", 108)

                    { id: 't1_1', title: 'Тема 1: Броеви и операции со броеви', content: tema1_1 },

                ]
            },
            "2": {
                global: {
                    title: 'Годишен глобален план за II година',
                    content: generateGlobalPlan("2", 108)
                },
                thematic: [
                    { id: 't2_1', title: 'Тема 1: Корени и комплексни броеви', content: tema2_1 },
                    { id: 't2_2', title: 'Тема 2: Квадратни равенки и равенки што се сведуваат на квадратни', content: tema2_2 },

                    { id: 't2_4', title: 'Тема 4: Елементи од веројатност', content: tema2_4 },
                    { id: 't2_5', title: 'Тема 5: Геометрија (тригонометрија, права и рамнина, пресеци)', content: tema2_5 },
                    { id: 't2_6', title: 'Тема 6: Мерење (2Д и 3Д)', content: tema2_6 }
                ]
            },

                global: {
                    title: 'Годишен план за III година',
                    content: `<div class="info-msg"><p style="font-size:28px;">📘</p><p style="font-size:20px;">Податоци за III година се уште не се внесени.</p><p style="font-size:15px;color:#6f7d95;">Ве молиме изберете I, II или IV година за целосен преглед.</p></div>`
                },
                thematic: []
            },
            "4": {
                global: {
                    title: 'Годишен глобален план за IV година',
                    content: generateGlobalPlan("4", 96)
                },
                thematic: [
                    { id: 't4_1', title: 'Тема 1: Низи и прогресии', content: tema4_1 },
                    { id: 't4_2', title: 'Тема 2: Функции и гранични вредности на функции', content: tema4_2 },

                    { id: 't4_5', title: 'Тема 5: Статистика', content: tema4_5 }
                ]
            }
        };

        const yearSelect = document.getElementById('yearSelect');
        const viewSelect = document.getElementById('viewSelect');

        const yearTitle = document.getElementById('yearTitle');
        const schoolYearDisplay = document.getElementById('schoolYearDisplay');
        const yearInput = document.getElementById('yearInput');
        const applyYearBtn = document.getElementById('applyYearBtn');

        function updateSchoolHeader(year, schoolYear) {
            const info = schoolData[year] || schoolData["4"];
            yearTitle.textContent = info.yearText;
            schoolYearDisplay.textContent = `Учебна година: ${schoolYear}`;
        }

        function render() {
            const year = yearSelect.value;
            const view = viewSelect.value;
            const yearData = data[year];

            updateSchoolHeader(year, currentSchoolYear);

            if (!yearData) {
                contentArea.innerHTML = `<div class="info-msg">Непостоечки податоци за избраната година.</div>`;
                return;
            }

            let html = '';

            if (view === 'global') {
                html = `<h2>${yearData.global.title}</h2>${yearData.global.content}`;
            } else {
                const themes = yearData.thematic || [];
                if (themes.length === 0) {
                    html = `<div class="info-msg">Нема теми за оваа година.</div>`;
                } else {
                    html = `<h2>Тематско планирање за ${schoolData[year].year}. година</h2>`;
                    themes.forEach((t) => {
                        html += `<div class="word-h1">${t.title}</div>${t.content}`;
                    });
                }
            }

            contentArea.innerHTML = html;
        }

        function applySchoolYear() {
            const newYear = yearInput.value.trim();
            if (newYear === '') {
                alert('Внесете ја учебната година (пр. 2026/2027)');
                return;
            }
            currentSchoolYear = newYear;
            render();
        }

        yearSelect.addEventListener('change', render);
        viewSelect.addEventListener('change', render);
        applyYearBtn.addEventListener('click', applySchoolYear);
        yearInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                applySchoolYear();
            }
        });

        render();

        // === ЗАШТИТА ===
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('paste', e => e.preventDefault());

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && ['p','c','u','s','a'].includes(e.key.toLowerCase())) {
                e.preventDefault();
                return false;
            }
        });

        document.querySelectorAll('.content, .container').forEach(el => {
            el.addEventListener('selectstart', e => e.preventDefault());
        });

        console.log('Страницата е заштитена – копирањето и печатењето се оневозможени.');
